name: Go Runner CI

on:
  pull_request:
    branches: [main]
    paths:
      - "services/execution-runner/**"
      - ".github/workflows/go-ci.yml"
      - "AGENTS.md"
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "services/execution-runner/**"
      - ".github/workflows/go-ci.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-contract:
    name: Go format, vet and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/execution-runner
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: services/execution-runner/go.mod

      - name: Verify local acceptance journal package
        run: test -f internal/acceptancejournal/journal.go

      - name: Print gofmt changes for acceptance journal
        run: |
          gofmt -w .
          git diff -- internal/acceptancejournal/journal.go

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -cover ./...

      - name: Compile opt-in Linux runsc qualification suite
        run: go test -tags=sandboxqualification -run="^$" ./internal/runner
